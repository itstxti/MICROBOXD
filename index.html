/* Sinopsis: expandir/colapsar con animación */
function synTog(el){const c=el.classList;if(!c.contains("cl")&&!c.contains("open"))return;
  const col=parseFloat(getComputedStyle(el).lineHeight)*3;
  if(c.contains("cl")){
    el.style.maxHeight=col+"px";c.replace("cl","open");void el.offsetHeight;el.style.maxHeight=el.scrollHeight+"px";
    const done=e=>{if(e.propertyName!=="max-height")return;el.removeEventListener("transitionend",done);if(c.contains("open"))el.style.maxHeight=""};
    el.addEventListener("transitionend",done)}
  else{
    el.style.maxHeight=el.scrollHeight+"px";c.replace("open","cl");void el.offsetHeight;el.style.maxHeight=col+"px";
    const done=e=>{if(e.propertyName!=="max-height")return;el.removeEventListener("transitionend",done);if(c.contains("cl"))el.style.maxHeight=""};
    el.addEventListener("transitionend",done)}}

<script>
/* Animación del indicador al cambiar de pestaña (.seg) */
(function(){
  const pos=new Map(),DUR=280;let tap=0;
  addEventListener("pointerdown",e=>{if(e.target.closest&&e.target.closest(".seg button"))tap=Date.now()},true);
  addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest(".seg button"))tap=Date.now()},true);
  const key=seg=>[...seg.children].filter(b=>b.tagName==="BUTTON").map(b=>b.textContent.trim()).join("|");
  function upd(seg){
    const on=seg.querySelector(":scope>button.on");if(!on||!seg.offsetWidth)return;
    let ind=seg.querySelector(":scope>.segi");
    if(!ind){ind=document.createElement("i");ind.className="segi";seg.insertBefore(ind,seg.firstChild)}
    const k=key(seg),x=on.offsetLeft,w=on.offsetWidth,prev=pos.get(k),set=(l,wd)=>{ind.style.transform="translateX("+l+"px)";ind.style.width=wd+"px"};
    if(ind.dataset.l!==undefined&&(+ind.dataset.l===x)&&(+ind.dataset.w===w)){return}
    const fresh=ind.dataset.l===undefined,now=Date.now(),
      cont=fresh&&prev&&prev.an&&prev.x===x&&prev.w===w&&now-prev.an.t<DUR,
      fromPrev=fresh&&prev&&(prev.x!==x||prev.w!==w)&&now-tap<900;
    let an=null;
    if(fresh){ind.classList.remove("go");ind.style.transitionDuration="";
      if(cont){/* la pestaña se volvió a pintar a mitad de animación: continúa desde donde iba */
        const el=now-prev.an.t,p=Math.min(1,el/DUR),e=1-Math.pow(1-p,3),cx=prev.an.fx+(x-prev.an.fx)*e,cw=prev.an.fw+(w-prev.an.fw)*e;
        set(cx,cw);void ind.offsetWidth;an=prev.an;
        requestAnimationFrame(()=>{ind.classList.add("go");ind.style.transitionDuration=Math.max(30,DUR-el)+"ms";set(x,w)})}
      else if(fromPrev){set(prev.x,prev.w);void ind.offsetWidth;an={t:now,fx:prev.x,fw:prev.w};
        requestAnimationFrame(()=>{ind.classList.add("go");set(x,w)})}
      else set(x,w)}
    else{an={t:now,fx:+ind.dataset.l,fw:+ind.dataset.w};ind.classList.add("go");ind.style.transitionDuration="";set(x,w)}
    ind.dataset.l=x;ind.dataset.w=w;pos.set(k,{x,w,an});
    const cur=seg.querySelector(":scope>button.on");if(cur&&seg.scrollWidth>seg.clientWidth)cur.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})
  }
  function scan(root){(root.matches&&root.matches(".seg")?[root]:[]).concat([...(root.querySelectorAll?root.querySelectorAll(".seg"):[])]).forEach(upd)}
  const mo=new MutationObserver(ms=>{
    const segs=new Set();
    ms.forEach(m=>{
      if(m.type==="attributes"){const sg=m.target.closest&&m.target.closest(".seg");if(sg)segs.add(sg)}
      else m.addedNodes.forEach(n=>{
        if(n.nodeType!==1||n.classList.contains("segi"))return;
        if(n.matches(".seg"))segs.add(n);
        n.querySelectorAll(".seg").forEach(x=>segs.add(x))
      })
    });
    if(!segs.size)return;
    mo.disconnect();segs.forEach(upd);mo.observe(document.body,opt)
  });
  const opt={childList:true,subtree:true,attributes:true,attributeFilter:["class"]};
  mo.observe(document.body,opt);scan(document.body);
  addEventListener("resize",()=>document.querySelectorAll(".seg").forEach(sg=>{const i=sg.querySelector(":scope>.segi");if(i)delete i.dataset.l;upd(sg)}))
})();
</script>

  let lastKey=null,tmM=0,tmD=0;

  /* 1) Contenido principal: aparece al cambiar de pestaña o de sub-pestaña (no en cada render).
        Si la pantalla empieza con "Cargando…", se espera al contenido real y se anima una sola vez.
        Las clases van en los elementos que existen en ese momento, así un repintado posterior no repite la animación. */
  let pend=false,animT=0;
  function mainKey(){const tb=[...document.querySelectorAll("#tb button")],t=tb.findIndex(b=>b.classList.contains("on")),s=document.querySelector("#hd .seg button.on");return t+"|"+(s?s.textContent.trim():"")}
  const CL=["mbx-f","mbx-s","mbx-gy","mbx-gx"];
  /* Aplica la animación a lo que hay ahora en pantalla. Si es un repintado a mitad de animación
     (p. ej. llegan datos nuevos justo después de enseñar los de caché), continúa desde el mismo punto. */
  function play(mn,el){
    clearTimeout(tmM);
    const kids=[...mn.children],it=[...mn.querySelectorAll(".hp,.grid>*,.row,.act,.de,.logrow,.lrw,.lst2,.mrow")].slice(0,12),
      gy=[...mn.querySelectorAll(".bars u")],gx=[...mn.querySelectorAll(".stb>u i")],d=n=>(n-el)+"ms";
    kids.forEach(e=>{e.classList.add("mbx-f");if(el)e.style.animationDelay=d(0)});
    it.forEach((e,n)=>{e.style.animationDelay=d(n*20);e.classList.add("mbx-s")});
    gy.forEach((e,n)=>{e.style.animationDelay=d(n%10*30);e.classList.add("mbx-gy")});
    gx.forEach(e=>{e.classList.add("mbx-gx");if(el)e.style.animationDelay=d(0)});
    tmM=setTimeout(()=>{animT=0;[...kids,...it,...gy,...gx].forEach(e=>{e.classList.remove(...CL);e.style.animationDelay=""})},Math.max(60,900-el));
  }
  function onMain(){
    const k=mainKey(),first=lastKey===null,fresh=!first&&k!==lastKey;lastKey=k;
    const mn=$("mn");if(!mn||RM.matches)return;
    if(mn.querySelector("#sr")){pend=false;animT=0;return}
    const loading=!!mn.querySelector(".ld");
    if(fresh){pend=true;animT=0}
    if(loading)return;
    if(pend){pend=false;animT=performance.now();play(mn,0);return}
    const el=animT?performance.now()-animT:0;
    if(animT&&el<700)play(mn,el)
  }

  /* 2) Detalle de serie: las barras crecen al abrir; al puntuar pasan del valor antiguo al nuevo */
  function onDet(m){
    const d=$("det");if(!d||RM.matches)return;
    const oldT=h2(m.removedNodes),newT=h2(m.addedNodes);
    if(newT===null)return;
    const same=oldT!==null&&oldT===newT;
    clearTimeout(tmD);
    if(!same){d.classList.add("fr");tmD=setTimeout(()=>d.classList.remove("fr"),900);return}
    d.classList.remove("fr");
    [[".sx b","width"],[".bars u","height"]].forEach(([sel,prop])=>{
      const o=find(m.removedNodes,sel),n=find(m.addedNodes,sel);
      if(!n.length||o.length!==n.length)return;
      const to=n.map(e=>e.style[prop]);let any=false;
      n.forEach((e,k)=>{const ov=o[k].style[prop];if(ov&&ov!==to[k]){e.style[prop]=ov;any=true}});
      if(!any)return;
      void d.offsetWidth;
      requestAnimationFrame(()=>n.forEach((e,k)=>{e.style[prop]=to[k]}));
    });
  }

  /* 3) Rebote al dar like / seguir / cambiar de pestaña inferior */
  function onPop(m){
    if(RM.matches)return;
    const t=m.target;
    if(t.nodeType===1&&t.classList&&t.classList.contains("mfl")&&t.classList.contains("on")){pop(t.querySelector("svg"));return}
    const on=find(m.addedNodes,".hb2.on"),old=find(m.removedNodes,".hb2");
    if(on.length&&old.length===on.length)on.forEach((e,k)=>{if(!old[k].classList.contains("on"))pop(e.querySelector("svg"))});
    if(t.id==="tb"){
      const idx=l=>l.findIndex(b=>b.classList.contains("on")),ob=find(m.removedNodes,"button"),nb=find(m.addedNodes,"button"),a=idx(ob),b=idx(nb);
      if(a>=0&&b>=0&&a!==b)pop(nb[b].querySelector("svg"));
    }
  }

  new MutationObserver(ms=>{
    for(const m of ms){
      if(m.type!=="childList")continue;
      const t=m.target;
      if(t.id==="mn")onMain();
      else if(t.id==="det")onDet(m);
      onPop(m);
    }
  }).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body>
</html>
