<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Microboxd</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark">
<script src="/js/theme.js?b=1795722338"></script>
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Microboxd">
<link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css?b=1795722338">
</head>
<body>
<nav id="dn"></nav>
<header id="hd"></header>
<main id="mn"></main>
<nav id="tb"></nav>
<div class="sheet" id="ad"></div><div class="sheet" id="lst"></div><div class="sheet" id="det"></div><div class="sheet" id="sub"></div><div class="sheet" id="le"></div><div class="sheet" id="fp"></div><div class="sheet" id="set"></div>
<div class="sheet" id="lgs"></div><div class="sheet" id="tgs"></div><div class="gate" id="gate"></div><div class="toast" id="toast"></div><div class="ov" id="ov" onclick="if(event.target===this)closeOv()"></div>
<div class="sheet" id="form"><div class="in fm">
  <div class="lh"><button id="cancel">Cancelar</button><b id="ftl">Nueva serie</b><span></span></div>
  <div class="fr">
    <label class="cv" for="f-img"><span><i>＋</i>Portada</span><img class="prev" id="prev" alt=""></label>
    <input id="f-img" type="file" accept="image/*" hidden>
    <div class="fc">
      <div><label class="fl" for="f-title">Título</label>
      <input id="f-title" placeholder="Ej. Mi CEO favorito" autocomplete="off">
      <div class="warn" id="dup"></div></div>
      <div><label class="fl" for="f-app">App</label>
      <select id="f-app"></select><div class="link" style="margin-top:8px;cursor:pointer;font-size:14px" id="f-appmg" onclick="platOpen()">Gestionar plataformas</div><input id="f-app2" maxlength="30" placeholder="Nombre de la plataforma" style="display:none;margin-top:8px;width:100%;box-sizing:border-box"></div>
    </div>
  </div>
  <label class="fl" for="f-syn">Sinopsis</label>
  <textarea id="f-syn" rows="4" placeholder="¿De qué va?"></textarea>
  <label class="fl" for="f-tq">Temas <span id="tmn" class="tmn"></span></label>
  <input id="f-tropes" type="hidden">
  <div class="tmb" onclick="$('f-tq').focus()"><span id="tmc"></span><input id="f-tq" placeholder="Añadir tema…" autocomplete="off" autocapitalize="none" autocorrect="off" enterkeyhint="done" oninput="tmIn()" onkeydown="tmKey(event)" onblur="setTimeout(tmCommit,150)"></div>
  <div id="tmd"></div><div id="tmp"></div>
  <label class="fl">Personajes</label>
  <div class="fcg"><div id="fcl"></div><button type="button" class="fca" id="fca">＋ Añadir personaje</button></div>
  <label class="fl" for="f-eps">Episodios</label>
  <input id="f-eps" type="number" min="1" inputmode="numeric" placeholder="60">
  <label class="fl" for="f-min">Duración total (min) <span style="opacity:.6">· opcional</span></label>
  <input id="f-min" type="number" min="1" max="20000" step="1" inputmode="decimal" placeholder="90">
  <div class="fs"><button class="btn p" id="save">Guardar serie</button><button class="btn d" id="fdel" style="display:none;margin-top:6px" onclick="askDel(editId)">Eliminar serie</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/i18n.js?b=1795722338"></script>
<script src="/js/core.js?b=1795722338"></script>
<script src="/js/desktop.js?b=1795722338"></script>
<script src="/js/shell.js?b=1795722338"></script>
<script src="/js/filters.js?b=1795722338"></script>
<script src="/js/settings.js?b=1795722338"></script>
<script src="/js/detail.js?b=1795722338"></script>
<script src="/js/log.js?b=1795722338"></script>
<script src="/js/diary.js?b=1795722338"></script>
<script src="/js/lists.js?b=1795722338"></script>
<script src="/js/config.js?b=1795722338"></script>
<script src="/js/data.js?b=1795722338"></script>
<script src="/js/gestures.js?b=1795722338"></script>
<script src="/js/reviews.js?b=1795722338"></script>
<script src="/js/people.js?b=1795722338"></script>
<script src="/js/form.js?b=1795722338"></script>
<script src="/js/crop.js?b=1795722338"></script>
<script src="/js/nav.js?b=1795722338"></script>
<script src="/js/runtime.js?b=1795722338"></script>
<script src="/js/anim-tabs.js?b=1795722338"></script>
<script src="/js/anim-extra.js?b=1795722338"></script>
</body>
</html>
