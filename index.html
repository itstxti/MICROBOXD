<div class="sheet" id="ad"></div><div class="sheet" id="lst"></div><div class="sheet" id="det"></div><div class="sheet" id="sub"></div><div class="sheet" id="le"></div><div class="sheet" id="fp"></div><div class="sheet" id="set"></div>
<div class="sheet" id="lgs"></div><div class="sheet" id="tgs"></div><div class="gate" id="gate"></div><div class="toast" id="toast"></div><div class="ov" id="ov" onclick="if(event.target===this)closeOv()"></div>
<div class="sheet" id="form"><div class="in fm">
  <div class="lh"><button id="cancel">Cancelar</button><b id="ftl">Nueva serie</b><span></span></div>
  <div class="fr">
    <label class="cv" for="f-img"><span><i>＋</i>Portada</span><img class="prev" id="prev" alt=""></label>
    <input id="f-img" type="file" accept="image/*" hidden>
    <div class="fc">
      <div><label class="fl" for="f-title">Título</label>

</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const APPS=["DramaBox","ReelShort","ShortMax","GoodShort","FlexTV","Otra"];
const ST={want:"Quiero ver",done:"Vista"};
const KEY="microboxd:v1",LK="microboxd:log";
let prof={name:"",fam:"",email:"",loc:"",web:"",bio:"",pron:"",fav:[]},items=[],log=[],lists=[],sq="s",sf=0,adq="",tab="home",q="",cover="";
const SQL={s:"Series",r:"Reseñas",l:"Listas",m:"Miembros"};let RSQ=[];try{RSQ=JSON.parse(localStorage.getItem("microboxd:rsq")||"[]").filter(x=>x&&x.q&&SQL[x.k])}catch(e){}
const rsqSave=()=>{try{localStorage.setItem("microboxd:rsq",JSON.stringify(RSQ))}catch(e){}};
function rsqAdd(){const t=q.trim();if(!t)return;const k=RSQ.findIndex(x=>x.q.toLowerCase()===t.toLowerCase());if(k>=0)RSQ.splice(k,1);RSQ.unshift({q:t,k:sq});RSQ=RSQ.slice(0,12);rsqSave()}
function rsqUse(n){const x=RSQ[n];if(!x)return;sq=x.k;q=x.q;const i=$("qi");if(i){i.value=q;i.focus();i.nextElementSibling.style.display=""}sr()}
function rsqDel(n,e){e.stopPropagation();RSQ.splice(n,1);rsqSave();sr()}
function rsqClear(){RSQ=[];rsqSave();sr()}
const rsqH=()=>RSQ.length?`<div class="rsqh"><span>BÚSQUEDAS RECIENTES</span><button onclick="rsqClear()">Borrar</button></div>`+RSQ.map((x,n)=>`<div class="rsq" onclick="rsqUse(${n})"><span class="rq">${esc(x.q)}</span><span class="rk">${SQL[x.k]}</span><button aria-label="Quitar" onclick="rsqDel(${n},event)">×</button></div>`).join(""):"";
document.addEventListener("click",e=>{if(tab==="search"&&q.trim()&&e.target.closest&&e.target.closest("#sr")&&!e.target.closest(".ptabs,.rsq,.rsqh"))rsqAdd()},true);
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.id==="qi"){rsqAdd();e.target.blur()}});
const seg={home:"series",act:"me",me:"perfil"};
const SEGS={home:[["series","Series"],["rev","Reseñas"],["lst","Listas"],["jr","Diario"]],act:[["fr","Amigos"],["me","Tú"],["in","Entrantes"]],me:[["perfil","Perfil"],["diary","Diario"],["lst","Listas"],["pend","Watchlist"]]};
let LEG=null;try{LEG={items:JSON.parse(localStorage.getItem(KEY)||"null")||[],lists:JSON.parse(localStorage.getItem("microboxd:lists")||"null")||[],prof:JSON.parse(localStorage.getItem("microboxd:prof")||"null")||{}}}catch(e){}
const $=id=>document.getElementById(id);
let rs=[],drafts={},tT=0;try{rs=JSON.parse(localStorage.getItem("microboxd:rs")||"[]");drafts=JSON.parse(localStorage.getItem("microboxd:drafts")||"{}")}catch(e){}
const pers=()=>{try{localStorage.setItem("microboxd:rs",JSON.stringify(rs));localStorage.setItem("microboxd:drafts",JSON.stringify(drafts))}catch(e){}};
function toast(m){const t=$("toast");t.innerHTML=m;t.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("on"),2600)}
let pendS=[],pendU=[];const save=()=>{adopt();sched()};
const uname=()=>(prof.name||"").trim()||"tú",ini=()=>'<i class="mav"></i>';
const setMe=()=>{const u=prof.avd||(prof.av?cvr(prof.av):"");document.documentElement.style.setProperty("--meav",u?`url("${u}")`:"none")};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const get=id=>items.find(i=>i.id===id)||cache[id];
const short=t=>t.replace(/^Ejemplo:\s*/,"");
const S=n=>"★".repeat(Math.floor(n))+(n%1?"½":"");
const fsh=ts=>new Date(ts).toLocaleDateString("es",{day:"numeric",month:"short",year:"numeric"});
const fmt=ts=>new Date(ts).toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const rel=ts=>{const d=Math.floor((Date.now()-ts)/864e5);return d<1?"hoy":d<7?d+" d":Math.floor(d/7)+" sem"};
const addLog=(t,i)=>{log.unshift({t,id:i.id,title:i.title,r:i.rating,ts:Date.now()});log=log.slice(0,100)};
$("f-app").innerHTML=APPS.map(a=>`<option>${a}</option>`).join("");

const IC={home:'<rect x="5" y="3" width="11" height="18" rx="2"/><path d="M19 6v12"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>',add:'<circle cx="12" cy="12" r="10"/><path d="M12 7v10M7 12h10"/>',act:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
const EI={tv:'<rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 21h8M12 18v3"/>',book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 8h6"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',bell:'<path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/>'};
const EMP=(ic,t,sub,btn,fn)=>`<div class="empty em"><div class="emi">${svg(EI[ic]||EI.tv,44)}</div><b>${t}</b>${sub?`<p>${sub}</p>`:""}${btn?`<button class="emb" onclick="${fn}">${btn}</button>`:""}</div>`;
const svg=(p,s=28)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const LOGO=`<svg viewBox="0 0 24 24" width="26" height="26"><defs><clipPath id="ca"><polygon points="0,0 14,0 10,24 0,24"/></clipPath><clipPath id="cb"><polygon points="14,0 24,0 24,24 10,24"/></clipPath></defs><g clip-path="url(#ca)"><path fill="var(--g)" d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></g><g clip-path="url(#cb)"><path transform="translate(1.2 -1.4)" fill="var(--o)" d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></g></svg>`;

function poster(i){
  const h=hue(i.title);
  return `<div class="poster" onclick="show(${i.id})">${i.cover?`<img src="${i.cover}" alt="">`:
  `<div class="fb" style="background:linear-gradient(160deg,hsl(${h},60%,38%),hsl(${(h+50)%360},65%,16%))"><small>${esc(i.app)}</small><b>${esc(short(i.title))}</b></div>`}<div class="pb"><i style="width:${i.watched/i.eps*100}%"></i></div></div>`;
}
const cell=i=>`<div>${poster(i)}<div class="ss">${S(i.rating)}</div></div>`;
const grid=(l,c)=>l.length?`<div class="grid ${c||""}">${l.map(cell).join("")}</div>`:'<div class="empty">Nada por aquí todavía.</div>';
const hrow=(t,l)=>l.length?`<h3 class="sec">${t}</h3><div class="hrow">${l.map(i=>`<div class="hp">${poster(i)}<div class="ss">${S(i.rating)}</div></div>`).join("")}</div>`:"";

const SBH=()=>`<div class="sbw"><div class="sbr"><div class="sb">${svg(IC.search,20)}<input id="qi" placeholder="Busca series, apps, tropos…" value="${esc(q)}" onfocus="if(!sf){sf=1;this.parentNode.nextElementSibling.style.display='';sr()}" oninput="q=this.value;this.nextElementSibling.style.display=q?'':'none';this.parentNode.nextElementSibling.style.display=(q||sf)?'':'none';sr()"><button class="sbx" aria-label="Borrar" style="display:${q?"":"none"}" onclick="q='';render();$('qi')&&$('qi').focus()">×</button></div><button class="sbc" style="display:${q||sf?"":"none"}" onclick="sCancel()">Cancelar</button></div></div>`;
function sCancel(){q="";sf=0;const i=$("qi");if(i){i.value="";i.blur()}const c=document.querySelector(".sbc");if(c)c.classList.add("x");sr();setTimeout(()=>{if(tab==="search"&&!sf&&!q.trim()){if(c){c.style.display="none";c.classList.remove("x")}spl("")}},320)}
function render(){
  const titles={home:LOGO+"Microboxd",search:"Buscar",act:"Actividad",me:esc(uname())};
  const sg=SEGS[tab];
  const bn=tab==="search"&&br.length&&!q.trim()?br[br.length-1]:null;
  $("hd").innerHTML=(bn?`<h1 class="bkb"><button onclick="brBack()">‹ ${br.length>1?esc(brTitle(br[br.length-2])):"Explorar"}</button><b>${esc(brTitle(bn))}</b><span></span></h1>`:tab==="me"?`<h1 class="h1p"><button class="gear" aria-label="Ajustes" onclick="openSet()">${svg(GEAR,22)}</button>${titles[tab]}${seg.me==="lst"?`<button class="plus2" aria-label="Nueva lista" onclick="editList()">${svg('<path d="M12 4v16M4 12h16"/>',26)}</button>`:""}<button class="dots" aria-label="Más" onclick="meOpts()">•••</button></h1>`:tab==="search"?`<h1>Buscar</h1>${SBH()}<div id="spl"></div>`:`<h1>${titles[tab]}</h1>`)+(sg?`<div class="seg">${sg.map(([k,l])=>`<button class="${seg[tab]===k?"on":""}" onclick="setSeg('${k}')">${l}</button>`).join("")}</div>`:"");
  $("tb").innerHTML=["home","search","add","act","me"].map(t=>`<button class="${t==="add"?"plus":tab===t?"on":""}" aria-label="${t}" onclick="go('${t}')">${(tab===t&&t!=="add"&&t!=="search")?svg(IC[t],26).replace('fill="none"','fill="currentColor"'):svg(IC[t],t==="add"?30:26)}</button>`).join("");
  let h="";
  if(tab==="home"){
    if(seg.home==="series"){
      h=hrow("Añadidas recientemente",items.slice(0,10))+hrow("Mejor valoradas",items.filter(i=>i.rating).sort((a,b)=>b.rating-a.rating).slice(0,10));
      if(!items.length)h=EMP("tv","Tu biblioteca está vacía","Añade tu primera serie para empezar a puntuar y reseñar.","Añadir serie","openAdd()");
    }else if(seg.home==="jr"){h=diary();}else if(seg.home==="lst"){h=lv(lists,0)+(lists.length?'<div style="text-align:center;padding:6px 0 18px"><button class="emb" onclick="editList()">Nueva lista</button></div>':"");
    }else{
      h=hrH();
    }
  }else if(tab==="search"){
    if(br.length&&!q.trim())sf=0;
    h='<div id="sr"></div>';
  }else if(tab==="act"){
    if(seg.act==="fr")h=feedH();
    else if(seg.act==="in")h=incH();
    else{const g=[];log.forEach(e=>{const l=g[g.length-1];if(l&&l.id===e.id&&Math.abs(l.ts-e.ts)<2500)l.es.push(e);else g.push({id:e.id,ts:e.ts,title:e.title,es:[e]})});
      h=g.length?g.map(o=>{const it=get(o.id),t=o.es.map(e=>e.t),r=(o.es.find(e=>e.t==="rate")||{}).r,v=[];
        if(t.includes("add")&&t.length===1)v.push("Añadiste");else{if(t.includes("done"))v.push("viste");if(it&&it.liked&&(t.includes("done")||t.includes("rate")))v.push("marcaste con me gusta");if(t.includes("rate"))v.push("puntuaste")}
        let x=v.length>1?v.slice(0,-1).join(", ")+" y "+v[v.length-1]:v[0];x=x.charAt(0).toUpperCase()+x.slice(1);
        return `<div class="act" ${it?`onclick="show(${it.id})" style="cursor:pointer"`:""}><div class="av">${ini()}</div><div>${x} <b>${esc(short(o.title))}</b>${r?" "+S(r):""} el ${fmt(o.ts)}</div><span class="t">${rel(o.ts)}</span></div>`}).join(""):EMP("bolt","Todavía no hay actividad","Cuando puntúes, reseñes o añadas series, aparecerá aquí.")}
  }else{
    const done=items.filter(i=>i.rating),r=done.length?(done.reduce((a,i)=>a+i.rating,0)/done.length).toFixed(1):"–";
    if(seg.me==="perfil"){
      const pf=(prof.fav||[]).map(get).filter(Boolean),fav=pf.slice(0,4);
      const rec=[...new Set(log.map(e=>e.id))].map(get).filter(Boolean).slice(0,4);
      const yr=new Date().getFullYear(),thisYr=a=>a.filter(i=>i.watchedOn&&new Date(i.watchedOn).getFullYear()===yr).length,dn=items.filter(i=>i.status==="done");
      const row=(l,n,a)=>`<div class="link r" onclick="${a}">${l}<span>${n} ›</span></div>`;
      h=`<div class="av big">${ini()}</div>${profInfo()}<div class="stats"><div><b>${items.length}</b>Series</div><div><b>${items.reduce((a,i)=>a+i.watched,0)}</b>Episodios</div><div><b>${r}</b>Nota media</div></div>
      <div class="lbl">Favoritas</div><div class="grid" onpointerdown="pfDrag(event)">${fav.map((i,k)=>`<div class="fvq" data-k="${k}">${cell(i)}</div>`).join("")}${'<div class="fve" onclick="favAdd()">＋</div>'.repeat(4-fav.length)}</div><div class="lbl">Actividad reciente</div>${grid(rec)}
      <div class="link" style="margin-top:0" onclick="go('act')">Más actividad <span>›</span></div>
      ${myHist()}
      <div style="margin-top:14px">${row("Series",`${dn.length} / ${thisYr(dn)} este año`,"openAll()")}${row("Diario",`${items.filter(i=>i.watchedOn).length} / ${thisYr(items)} este año`,"setSeg('diary')")}${row("Listas",lists.length,"setSeg('lst')")}${row("Reseñas",items.filter(i=>i.review).length,"openRev()")}${row("Watchlist",items.filter(i=>i.status==="want").length,"setSeg('pend')")}${row("Me gusta",items.filter(i=>i.liked).length,"openLikes()")}${row("Etiquetas",tagsAll().length,"openTags()")}${row("Siguiendo",`<span id="myfg">${FW.size}</span>`,`openFol('${U.id}','ing')`)}${row("Seguidores",`<span id="myfo">${MYFO===null?"–":MYFO}</span>`,`openFol('${U.id}','ers')`)}${row("Estadísticas","","openStats(null)")}</div>`;loadMyFo();
    }else if(seg.me==="diary")h=diary();else if(seg.me==="lst")h=lv(lists,0);else{const w=items.filter(i=>i.status==="want");h=w.length?grid(w):EMP("clock","Tu watchlist está vacía","Guarda aquí las series que quieres ver más adelante.","Buscar series","go('search')")}
  }
  $("mn").innerHTML=h;if(tab==="search")sr();else sfx();setNh();
}
const spl=h=>{const e=$("spl");if(e)e.innerHTML=h};let SRL=null,SRM=null;
function sfx(){const c=document.documentElement.classList;c.toggle("insr",tab==="search"&&!(br.length&&!q.trim()));c.toggle("sfoc",tab==="search"&&!!(sf||q.trim()))}
function sr(){
  sfx();const el=$("sr");if(!el)return;
  let old="";{const m=!q.trim()?(sf&&!br.length?"f":"b"):"r";if(el!==SRL){SRL=el;SRM=null}if(m!==SRM){if(m==="f"&&SRM==="b")old=el.innerHTML;SRM=m;el.classList.remove("an");void el.offsetWidth;el.classList.add("an")}}
  const pills=()=>`<div class="ptabs">${[["s","Series"],["r","Reseñas"],["l","Listas"],["m","Miembros"]].map(([k,l])=>`<button class="${sq===k?"on":""}" onclick="sq='${k}';sr()">${l}</button>`).join("")}</div>`;
  if(!q.trim()&&sf&&!br.length){
    spl(pills());el.innerHTML=rsqH();
    if(old){const o=document.createElement("div");o.className="oldc";o.innerHTML=old;el.appendChild(o);setTimeout(()=>o.remove(),330)}
  }else if(!q.trim()){
    el.innerHTML=br.length?brBody():`<h3 class="sec" style="margin-top:6px">Explorar por</h3>`+BRR.map(([k,l])=>`<div class="br" onclick="brPush('${k}')">${l}<span>›</span></div>`).join("");
  }else{
    const n=norm(q),tb=pills();
    spl(tb);el.innerHTML=(sq==="m"?`<div id="mem">${memHtml()}</div>`:sq==="r"?rvl(items.filter(i=>i.review&&norm(i.title+i.review).includes(n))):sq==="l"?lv(lists.filter(l=>norm(l.name+l.desc).includes(n)),0,"Sin resultados."):grid(catAll().filter(i=>norm(i.title+i.app+i.tropes.join("")).includes(n)),"g3"));
    if(sq==="m")memSearch()
  }
}
let br=[];
const BRR=[["apps","Aplicación"],["tropes","Tropo"],["pop","Más populares"],["top","Mejor valoradas"],["recent","Añadidas recientemente"],["lists","Listas"],["all","Todas las series"]];
const brTitle=n=>({apps:"Aplicación",tropes:"Tropo",app:n.v,trope:n.v,pop:"Más populares",top:"Mejor valoradas",recent:"Añadidas recientemente",lists:"Listas",all:"Todas las series"}[n.t]);
const brPush=(t,v)=>{br.push({t,v});render();$("mn").scrollTop=0};
const brBack=()=>{br.pop();render();$("mn").scrollTop=0};
function brBody(){const n=br[br.length-1],rows=(a,t)=>a.map(([l,c])=>`<div class="br" data-v="${esc(l)}" onclick="brPush('${t}',this.dataset.v)">${esc(l)}<span>${c} ›</span></div>`).join("");
  if(n.t==="apps")return rows(APPS.map(a=>[a,catAll().filter(i=>i.app===a).length]),"app");
  if(n.t==="tropes"){const tr=[...new Set(catAll().flatMap(i=>i.tropes))];return tr.length?rows(tr.map(t=>[t,catAll().filter(i=>i.tropes.includes(t)).length]),"trope"):'<div class="empty">Aún no hay tropos.</div>'}
  if(n.t==="app")return grid(catAll().filter(i=>i.app===n.v),"g3");
  if(n.t==="trope")return grid(catAll().filter(i=>i.tropes.includes(n.v)),"g3");
  if(n.t==="pop")return grid([...catAll()].sort((a,b)=>((com[key(b)]||[]).length+(b.rating?1:0))-((com[key(a)]||[]).length+(a.rating?1:0))||b.watched-a.watched),"g3");
  if(n.t==="top")return grid(items.filter(i=>i.rating).sort((a,b)=>b.rating-a.rating),"g3");
  if(n.t==="recent")return grid(catAll(),"g3");
  if(n.t==="all")return grid([...catAll()].sort((a,b)=>a.title.localeCompare(b.title)),"g3");
  return lv(lists,0)}
function setQ(v){q=v;$("qi").value=v;$("qi").nextElementSibling.style.display="";sr()}

/* Sinopsis: expandir/colapsar con animación */
function synTog(el){const c=el.classList;if(!c.contains("cl")&&!c.contains("open"))return;
  const col=parseFloat(getComputedStyle(el).lineHeight)*3;
  if(c.contains("cl")){
    el.style.maxHeight=col+"px";c.replace("cl","open");void el.offsetHeight;el.style.maxHeight=el.scrollHeight+"px";
    const done=e=>{if(e.propertyName!=="max-height")return;el.removeEventListener("transitionend",done);if(c.contains("open"))el.style.maxHeight=""};
    el.addEventListener("transitionend",done)}
  else{
    el.style.maxHeight=el.scrollHeight+"px";c.replace("open","cl");void el.offsetHeight;el.style.maxHeight=col+"px";
    const done=e=>{if(e.propertyName!=="max-height")return;el.removeEventListener("transitionend",done);if(c.contains("cl"))el.style.maxHeight=""};
    el.addEventListener("transitionend",done)}}
